<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crimson Wraith — 3D Character</title>
<style>
:root{--bg:#14161a;--fg:#e8e8ea;--ac:#c9183a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#v{position:fixed;inset:0}
#bar{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:10px}
button{background:#1f2227;color:var(--fg);border:1px solid #3a3d45;border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer}
button:hover,button.on{border-color:var(--ac);background:#2a1a20}
h1{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:14px;margin:0;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
h1 span{color:var(--ac)}
small{position:fixed;top:calc(32px + env(safe-area-inset-top,0px));left:14px;opacity:.6;font-size:12px}
</style></head><body>
<div id="v"></div>
<h1>Crimson <span>Wraith</span></h1><small>Drag to orbit · scroll to zoom · procedural 3D geometry</small>
<div id="bar"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
const T=THREE,PI=Math.PI;
const mk=(c,r,m,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:m},o||{}));
const M={blk:mk(0x17191d,.55,.3),suit:mk(0x24262b,.88,.02),red:mk(0xc9183a,.38,.2),lin:mk(0xb01632,.9,0,{side:T.DoubleSide}),
hw:mk(0x343840,.4,.8),rub:mk(0x0d0d0f,.9,0),mask:mk(0x0a0b0d,.35,.3),vis:mk(0x050506,.15,.5),
hood:mk(0x17191d,.8,.05,{side:T.DoubleSide}),slit:mk(0xc9183a,.4,0,{emissive:0x5a0a18})};
const root=new T.Group();
function rr(w,h,r){const s=new T.Shape(),x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}
function at(o,p,x,y,z){o.position.set(x||0,y||0,z||0);p.add(o);return o}
// beveled plate: w,h,d = x,y,z size
function P(w,h,d,m,p,x,y,z){const b=Math.min(d*.28,.005),g=new T.ExtrudeGeometry(rr(w-2*b,h-2*b,Math.min(w,h)*.18),{depth:d-2*b,bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:2});g.translate(0,0,-(d-2*b)/2);return at(new T.Mesh(g,m),p,x,y,z)}
function C(rt,rb,h,m,p,x,y,z,sz){const o=new T.Mesh(new T.CylinderGeometry(rt,rb,h,24),m);if(sz)o.scale.z=sz;return at(o,p,x,y,z)}
function S(r,m,p,x,y,z,sx,sy,sz){const o=new T.Mesh(new T.SphereGeometry(r,24,16),m);o.scale.set(sx||1,sy||1,sz||1);return at(o,p,x,y,z)}

// ---- torso
C(.15,.14,.16,M.suit,root,0,1.0,0,.72);
C(.17,.13,.38,M.suit,root,0,1.25,0,.66);
[1.12,1.165,1.21].forEach((y,i)=>P(.2-i*.004,.038,.03,M.blk,root,0,y,.1));
P(.27,.2,.05,M.blk,root,0,1.37,.11);          // chest shell
P(.05,.3,.025,M.red,root,0,1.34,.14);         // crimson centre strip
[1.3,1.36].forEach(y=>[1,-1].forEach(s=>P(.06,.014,.02,M.red,root,s*.1,y,.14)));
P(.3,.06,.05,M.blk,root,0,1.5,.07);           // collar plate
P(.22,.2,.04,M.blk,root,0,1.35,-.1);          // back panel
P(.04,.16,.02,M.red,root,0,1.36,-.13);
// ---- belt
const belt=C(.16,.16,.06,M.blk,root,0,1.06,0,.72);
P(.06,.05,.02,M.hw,root,0,1.06,.122);
function pouch(th,tall){const g=new T.Group();g.position.set(.16*Math.sin(th),1.04,.116*Math.cos(th));g.rotation.y=th;root.add(g);
 P(.06,tall,.04,M.blk,g,0,0,.02);P(.062,.024,.046,M.blk,g,0,tall/2-.01,.022);P(.012,.012,.01,M.red,g,0,tall/2-.012,.05)}
[.45,-.45].forEach(t=>pouch(t,.075));[1.05,-1.05].forEach(t=>pouch(t,.065));
[1.5,-1.5].forEach(t=>{const g=new T.Group();g.position.set(.16*Math.sin(t),1.04,.116*Math.cos(t));g.rotation.y=t;root.add(g);C(.02,.02,.08,M.hw,g,0,0,.025)});
// ---- head / hood
const H=new T.Group();H.position.y=1.69;root.add(H);
C(.05,.055,.09,M.suit,root,0,1.56,0);
function cap(r,m){const g=new T.SphereGeometry(r,40,24,0,PI*2,.75,2.39);g.rotateX(PI/2);const o=new T.Mesh(g,m);o.scale.set(1,1.15,1.05);return at(o,H,0,.005,-.01)}
cap(.14,M.hood);cap(.133,M.lin);
const lip=new T.Mesh(new T.TorusGeometry(.096,.016,12,48),M.red);lip.scale.y=1.15;at(lip,H,0,.005,.092);
S(.095,M.mask,H,0,-.005,0,.95,1.15,1);
P(.11,.034,.02,M.vis,H,0,.012,.092);
[1,-1].forEach(s=>{P(.03,.007,.01,M.slit,H,s*.026,.012,.103);P(.03,.05,.02,M.mask,H,s*.045,-.05,.075);
 const f=C(.015,.015,.012,M.red,H,s*.133,-.075,0);f.rotation.z=PI/2;const f2=C(.007,.007,.016,M.hw,H,s*.136,-.075,0);f2.rotation.z=PI/2});
P(.11,.022,.03,M.mask,H,0,.058,.085);
P(.16,.04,.05,M.hood,H,0,.125,.085).rotation.x=-.35;
C(.115,.19,.12,M.hood,H,0,-.135,-.02,.85);
// ---- shoulders & arms
[1,-1].forEach(s=>{
 const big=s<0?1.18:1,sh=new T.Group();sh.position.set(s*.215,1.47,0);root.add(sh);
 const d=new T.Mesh(new T.SphereGeometry(.085*big,24,12,0,PI*2,0,PI/2),M.blk);d.scale.set(1,.7,1.15);at(d,sh,s*.025,.015,0);
 const e=new T.Mesh(new T.TorusGeometry(.085*big,.008,8,32),M.red);e.rotation.x=PI/2;e.scale.set(1,1.15,1);at(e,sh,s*.025,.015,0);
 if(s<0){P(.1,.025,.11,M.blk,sh,-.03,.075,0);P(.04,.02,.1,M.red,sh,-.065,.07,0)}
 const arm=new T.Group();arm.rotation.z=s*.4;sh.add(arm);
 C(.05,.042,.28,M.suit,arm,0,-.14,0);C(.057,.055,.12,M.blk,arm,0,-.13,0);C(.059,.059,.018,M.red,arm,0,-.07,0);
 S(.048,M.blk,arm,0,-.29,0);P(.07,.08,.03,M.blk,arm,0,-.29,-.045);P(.03,.04,.015,M.red,arm,0,-.29,-.065);
 C(.042,.033,.26,M.suit,arm,0,-.43,0);C(.05,.04,.2,M.blk,arm,0,-.45,0);
 P(.04,.12,.02,M.red,arm,0,-.45,.047);C(.036,.036,.02,M.hw,arm,0,-.56,0);
 P(.068,.085,.034,M.blk,arm,0,-.62,0);P(.07,.022,.04,M.blk,arm,0,-.67,0);P(.026,.026,.01,M.red,arm,0,-.62,.02);
 [-.024,-.008,.008,.024].forEach((x,i)=>{C(.0095,.0085,.075-Math.abs(i-1.5)*.006,M.blk,arm,x,-.72,.002)});
 const th=C(.01,.009,.05,M.blk,arm,-s*.04,-.64,.015);th.rotation.z=s*.6;
});
// ---- legs
[1,-1].forEach(s=>{
 const lg=new T.Group();lg.position.set(s*.1,.92,0);root.add(lg);
 C(.085,.065,.42,M.suit,lg,0,-.23,0);P(.07,.12,.03,M.blk,lg,s*.01,-.2,.08);P(.03,.03,.012,M.red,lg,s*.01,-.17,.1);
 C(.083,.083,.024,M.hw,lg,0,-.12,0);
 P(.11,.13,.045,M.blk,lg,0,-.46,.07);P(.06,.085,.03,M.red,lg,0,-.46,.097);
 C(.06,.045,.38,M.suit,lg,0,-.68,0);P(.085,.3,.03,M.blk,lg,0,-.68,.058);P(.028,.24,.02,M.red,lg,0,-.68,.078);
 P(.03,.2,.02,M.red,lg,s*.058,-.68,0);
 C(.05,.052,.08,M.blk,lg,0,-.87,0);P(.05,.035,.02,M.red,lg,0,-.87,.052);
 const b=new T.Group();b.position.set(0,-.92,0);b.rotation.y=s*.12;lg.add(b);
 P(.112,.035,.285,M.rub,b,0,.017,.04);
 P(.1,.09,.2,M.blk,b,0,.08,.02);P(.095,.055,.075,M.red,b,0,.062,.14);
 P(.1,.05,.075,M.blk,b,0,.05,-.075);C(.056,.06,.11,M.blk,b,0,.15,-.01);
 P(.07,.03,.022,M.red,b,0,.15,.05);C(.06,.06,.016,M.hw,b,0,.11,-.01);P(.1,.014,.03,M.hw,b,0,.1,.06);
 [0,1,2,3].forEach(i=>P(.1,.006,.01,M.rub,b,0,.0045,-.07+i*.07+.02));
});
root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});

// ---- scene
const el=document.getElementById('v');
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;el.appendChild(R.domElement);
const sc=new T.Scene();sc.background=new T.Color(0x14161a);sc.fog=new T.Fog(0x14161a,6,12);
const cam=new T.PerspectiveCamera(32,1,.05,50);
sc.add(new T.HemisphereLight(0xb8c0d0,0x1a1a20,.9));
const key=new T.DirectionalLight(0xffffff,1.6);key.position.set(2,3.5,3);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-1.5,right:1.5,top:2.5,bottom:-.5});sc.add(key);
const rim=new T.DirectionalLight(0xff3050,1.1);rim.position.set(-2.5,2,-3);sc.add(rim);
const fill=new T.DirectionalLight(0x8090b0,.5);fill.position.set(-3,1,2);sc.add(fill);
const fl=new T.Mesh(new T.CircleGeometry(1.3,64),mk(0x1b1d22,.9,0));fl.rotation.x=-PI/2;fl.receiveShadow=true;sc.add(fl);
const ring=new T.Mesh(new T.RingGeometry(1.0,1.02,64),new T.MeshBasicMaterial({color:0xc9183a,side:T.DoubleSide}));ring.rotation.x=-PI/2;ring.position.y=.002;sc.add(ring);
sc.add(root);
const ctl=new T.OrbitControls(cam,R.domElement);ctl.enableDamping=true;ctl.maxPolarAngle=PI*.52;
const V={Front:[0,1,4.6,0,.95,0],Side:[4.6,1,0,0,.95,0],Rear:[0,1,-4.6,0,.95,0],'3/4':[3.2,1.4,3.4,0,.95,0],
'Hood':[.5,1.72,1.1,0,1.68,0],'Torso & belt':[1.2,1.3,2.0,0,1.2,0],'Knees & boots':[1.3,.5,2.0,0,.4,0]};
let goal=null;
function go(n){const v=V[n];goal={p:new T.Vector3(v[0],v[1],v[2]),t:new T.Vector3(v[3],v[4],v[5])};auto=false;ab.classList.remove('on')}
const bar=document.getElementById('bar');
Object.keys(V).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>go(n);bar.appendChild(b)});
let auto=true,wire=false;
const ab=document.createElement('button');ab.textContent='Auto-rotate';ab.className='on';ab.onclick=()=>{auto=!auto;ab.classList.toggle('on',auto)};bar.appendChild(ab);
const wb=document.createElement('button');wb.textContent='Wireframe';wb.onclick=()=>{wire=!wire;wb.classList.toggle('on',wire);Object.values(M).forEach(m=>m.wireframe=wire)};bar.appendChild(wb);
cam.position.set(3.2,1.4,3.4);ctl.target.set(0,.95,0);
function rs(){const w=innerWidth,h=innerHeight;R.setSize(w,h);cam.aspect=w/h;cam.fov=w<h?44:32;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
ctl.addEventListener('start',()=>{goal=null});
(function loop(){requestAnimationFrame(loop);
 if(goal){cam.position.lerp(goal.p,.08);ctl.target.lerp(goal.t,.08);if(cam.position.distanceTo(goal.p)<.01)goal=null}
 else if(auto)root.rotation.y+=.006;
 ctl.update();R.render(sc,cam)})();
</script></body></html>
